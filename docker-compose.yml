services:
  postgres:
    image: postgres:16-alpine
    container_name: cityflow_postgres_s08
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cityflow_s08}
      POSTGRES_USER: ${POSTGRES_USER:-cityflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityflow_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityflow_user} -d ${POSTGRES_DB:-cityflow_s08}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
